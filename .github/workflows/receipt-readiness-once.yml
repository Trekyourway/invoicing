name: Validate live receipt secrets (no issuance)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/receipt-readiness-once.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'Trekyourway/invoicing'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate presence of production key and matching decryption key, no HYP calls
        env:
          PRODUCTION_KEY: ${{ secrets.HYP_PRODUCTION_API_KEY }}
          RECEIPT_PRIVATE_KEY_B64: ${{ secrets.RECEIPT_PRIVATE_KEY_B64 }}
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import {readFileSync} from 'node:fs';
          let ok=true;
          if(!process.env.PRODUCTION_KEY){console.error('MISSING: HYP_PRODUCTION_API_KEY');ok=false;}
          else console.log('Present: HYP_PRODUCTION_API_KEY');
          if(!process.env.RECEIPT_PRIVATE_KEY_B64){console.error('MISSING: RECEIPT_PRIVATE_KEY_B64');ok=false;}
          else {
            try {
              const pem=Buffer.from(process.env.RECEIPT_PRIVATE_KEY_B64,'base64').toString('utf8');
              const got=crypto.createPublicKey(crypto.createPrivateKey(pem)).export({format:'pem',type:'spki'}).trim();
              const expected=readFileSync('keys/receipt_queue_public.pem','utf8').trim();
              if(got!==expected){console.error('MISMATCH: receipt private key does not match public key');ok=false;}
              else console.log('Present and matched: RECEIPT_PRIVATE_KEY_B64');
            } catch {console.error('INVALID: RECEIPT_PRIVATE_KEY_B64');ok=false;}
          }
          console.log('No production receipt created during this check');
          if(!ok)process.exitCode=1;
          NODE
