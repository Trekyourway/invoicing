<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOURWAY | קבלות</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#f6f7f6;background:#16191b}*{box-sizing:border-box}body{margin:0;padding:20px;max-width:990px;margin-inline:auto}h1{font-size:26px;margin:12px 0 5px}.small{font-size:13px;color:#a9b1b4}h2{font-size:18px;margin:24px 0 8px}label{display:block;margin:12px 0 4px;font-size:14px}input,select,button,textarea{font:inherit}input,select,textarea{width:100%;padding:12px;border:1px solid #697073;border-radius:9px;background:#22272a;color:#fff}button{background:#ef5fb2;color:#121212;padding:11px 15px;border:0;border-radius:9px;font-weight:700;cursor:pointer}button.secondary{background:#b3efcf}button.gray{background:#c4ccd1}button:disabled{opacity:.4}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.panel{border:1px solid #40484b;border-radius:13px;padding:18px;margin:16px 0}.full{grid-column:1/-1}.entry{border-top:1px solid #40484b;padding:15px 0}.entry:first-child{border-top:0}.entry p{margin:4px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}code{font-size:12px;word-break:break-all}.err{color:#ff9494}.ok{color:#b3efcf}.hide{display:none}#message{white-space:pre-wrap;min-height:25px}a{color:#a7f3cb}#start{max-width:500px}small{color:#b0b6b8} .w100{width:100%}@media(max-width:600px){.grid{grid-template-columns:1fr}body{padding:13px}h1{font-size:24px}}
</style></head><body><h1>YOURWAY / קבלות</h1><div class="small">קבלה דיגיטלית ללקוח שכבר שילם, דרך HYP</div><section class="panel" id="start"><label for="token">מפתח כניסה למערכת (נשמר בלשונית זו בלבד)</label><input id="token" type="password" autocomplete="off"><div class="actions"><button id="signin">כניסה</button></div></section>
<main id="app" class="hide"><div class="panel"><strong id="mode"></strong><div class="actions"><button id="refresh" class="gray">רענון</button><button id="signout" class="gray">התנתקות</button></div></div>
<h2>הפקת קבלה חדשה</h2><form id="payment" class="panel"><input type="hidden" name="id" id="editing"><div class="grid"><div><label>שם לקוח</label><input name="customer_name" required></div><div><label>מייל לקוח</label><input name="customer_email" type="email" required></div><div><label>סכום בש״ח</label><input name="amount_ils" type="number" min="0.01" step=".01" required></div><div><label>תאריך התקבל</label><input name="payment_date" type="date" required></div><div><label>אמצעי תשלום</label><select name="payment_method"><option value="bit">Bit</option><option value="paybox">PayBox</option><option value="bank_transfer">העברה בנקאית</option><option value="other">אחר</option></select></div><div class="full"><label>תיאור השירות</label><input name="description" required></div></div><div class="actions"><button type="submit" id="issue-submit">הפקת קבלה ושליחה במייל</button><button type="button" id="reset" class="gray">תשלום חדש</button></div><p class="small">הלחיצה מאשרת שהתשלום התקבל. אין צורך לצרף צילום מסך או להתחבר לבנק.</p></form>
<h2>קבלות אחרונות</h2><section class="panel"><div id="items"></div></section></main><div id="message" role="status"></div><script src="/admin.js" defer></script></body></html>
